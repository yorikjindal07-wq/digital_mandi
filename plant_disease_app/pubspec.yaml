name: digital_mandi
description: "AI-Powered Offline Smart Farming Assistant"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10+1
  google_fonts: ^6.2.1
  lottie: ^3.1.2

  # Camera & Image
  image_picker: ^1.0.7
  camera: ^0.11.0+2
  image: ^4.1.7

  # ML On-Device
  tflite_flutter: ^0.12.1
  google_mlkit_text_recognition: ^0.15.1

  # Local Database
  sqflite: ^2.3.3+1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.3
  path: ^1.9.0

  # Speech & Voice
  speech_to_text: ^7.3.0
  flutter_tts: ^4.2.0
  permission_handler: ^11.3.1

  # State Management
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2

  # Network (optional sync)
  http: ^1.6.0
  connectivity_plus: ^6.0.3

  # Localization
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.9

flutter:
  uses-material-design: true

  assets:
    - assets/model/vision_model.tflite
    - assets/model/crop_model.tflite
    - assets/data/crop_scaler.json
    - assets/data/treatments.json
    - assets/data/crops.json
    - assets/data/weather_history.json
    - assets/data/chatbot_responses.json
    - assets/data/india_locations.json
    - assets/images/

  fonts:
    - family: NotoSansDevanagari
      fonts:
        - asset: assets/fonts/NotoSansDevanagari-Regular.ttf
        - asset: assets/fonts/NotoSansDevanagari-Bold.ttf
          weight: 700
